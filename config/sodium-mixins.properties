# This is the configuration file for Sodium.
#
# You can find information on editing this file and all the available options here:
# https://github.com/CaffeineMC/sodium/wiki/Configuration-File
#
# By default, this file will be empty except for this notice.

# Disable Sodium's custom mipmap generator (fills transparent pixels with a
# lighter "nicer leaves" color to avoid black fringing at a distance).
# This restores vanilla Mojang's mipmap generation, which uses the raw
# black RGB stored under alpha=0 in the leaves textures.
mixin.features.textures.mipmaps=false
